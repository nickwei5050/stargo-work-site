name: Preview on Cloudflare Pages

# Uploads this branch to the Pages project `stargowork` as a PREVIEW (branch alias
# preview-download.stargowork.pages.dev). A preview never changes stargowork.com:
# only a deploy with --branch main does (deploy.yml). This exists so the owner can
# click through a change before approving it; it only runs for this one branch.

on:
  push:
    branches: [claude/project-thread-8atgcl]

concurrency:
  group: preview-download
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALIAS: preview-download
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package the site into dist/
        run: node tools/make-dist.mjs
      - name: Upload as a preview (not production)
        run: npx --yes wrangler@4.20.0 pages deploy dist --project-name stargowork --branch "$ALIAS" --commit-hash "$GITHUB_SHA" --commit-message "preview@${GITHUB_SHA::7}" | tee /tmp/wrangler-preview.log
      - name: Check the preview answers
        run: |
          url=$(grep -o 'https://[a-z0-9-]*\.stargowork\.pages\.dev' /tmp/wrangler-preview.log | tail -1)
          [ -n "$url" ] || { echo "no preview URL in the wrangler output"; exit 1; }
          sleep 15
          for path in / /download /en/download /capabilities; do
            echo "$url$path → $(curl -s -o /dev/null -w '%{http_code}' "$url$path")"
          done
          echo "Preview: $url (alias https://$ALIAS.stargowork.pages.dev)" | tee -a "$GITHUB_STEP_SUMMARY"
