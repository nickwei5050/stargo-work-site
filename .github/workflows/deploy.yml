name: Deploy to Cloudflare Pages

# Publishes the site to the Cloudflare Pages project `stargo` whenever main
# changes. Every change reaches main through a pull request that "Site
# verification" has already checked, so this job only packages and uploads.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   an API token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the `stargo` project
# Until both exist the job says so and stops without failing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the deploy secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; nothing was deployed." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: '22'

      - name: Package the site into dist/
        if: steps.secrets.outputs.ready == 'true'
        run: node tools/make-dist.mjs

      - name: Upload to Cloudflare Pages
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes wrangler@4.20.0 pages deploy dist --project-name stargo --branch main --commit-hash "$GITHUB_SHA" --commit-message "main@${GITHUB_SHA::7}"

      # stargo.pages.dev is the retired host: functions/_middleware.js answers
      # every page there with a 301 to the same page on https://stargowork.com,
      # so a page passes on that redirect (or on a 200, before it is live).
      - name: Smoke-check production
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sleep 20
          for path in / /en/ /pricing /contact; do
            got=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://stargo.pages.dev$path")
            echo "$path → $got"
            case "$got" in
              "200 "*|"301 https://stargowork.com$path") ;;
              *) exit 1 ;;
            esac
          done
          echo "Deployed main@${GITHUB_SHA::7} to the stargo project (stargo.pages.dev redirects to https://stargowork.com)" >> "$GITHUB_STEP_SUMMARY"
