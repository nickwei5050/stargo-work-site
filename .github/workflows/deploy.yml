name: Deploy to Cloudflare Pages

# Publishes the site to the Cloudflare Pages project `stargowork` (custom domains stargowork.com and
# www.stargowork.com; checked 2026-11-09) whenever main
# changes. Every change reaches main through a pull request that "Site
# verification" has already checked, so this job only packages and uploads.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   an API token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the `stargowork` project
# The old project `stargo` has no custom domain (only stargo.pages.dev, which 301s to stargowork.com), so a deploy
# there changes nothing users see: until 2026-11-09 this job deployed there and stargowork.com stayed stale.
# Until both exist the job says so and stops without failing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the deploy secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; nothing was deployed." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: '22'

      - name: Package the site into dist/
        if: steps.secrets.outputs.ready == 'true'
        run: node tools/make-dist.mjs

      - name: Upload to Cloudflare Pages
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes wrangler@4.20.0 pages deploy dist --project-name stargowork --branch main --commit-hash "$GITHUB_SHA" --commit-message "main@${GITHUB_SHA::7}" | tee /tmp/wrangler.log

      # stargowork.com answers 403 to curl from GitHub's runners (Cloudflare bot protection, run 42653528315), so the
      # check is: this deployment is the one the project serves on stargowork.com (Pages API), and its own URL
      # carries this build's footer. The domain itself is then tried with a browser User-Agent, for the record only.
      - name: Smoke-check production
        if: steps.secrets.outputs.ready == 'true'
        run: |
          url=$(grep -o 'https://[a-z0-9]*\.stargowork\.pages\.dev' /tmp/wrangler.log | tail -1)
          [ -n "$url" ] || { echo "no deployment URL in the wrangler output"; exit 1; }
          id=${url#https://}; id=${id%%.*}
          sleep 20
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/stargowork" > /tmp/project.json
          node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/project.json','utf8')).result||{};const d=p.domains||[];const c=(p.canonical_deployment||{}).id||'';console.log('domains: '+d.join(', ')+'; serving '+c);if(!d.includes('stargowork.com')){console.log('stargowork.com is not a domain of project stargowork');process.exit(1)}if(!c.startsWith('$id')){console.log('project does not serve deployment $id');process.exit(1)}"
          for path in / /en/ /pricing /contact; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url$path")
            echo "$url$path → $code"
            [ "$code" = 200 ] || exit 1
          done
          curl -s "$url/" > /tmp/home.html
          # The copyright line of the page just built must be the one served (it carries the Stargo Growth line).
          node -e "const fs=require('fs');const re=/© 2026 STARGO WORK[^]*?<\/p>/;const want=(fs.readFileSync('dist/index.html','utf8').match(re)||[])[0];const got=(fs.readFileSync('/tmp/home.html','utf8').match(re)||[])[0];if(!want||want!==got){console.log('deployed footer differs from this build:\n want '+want+'\n got  '+got);process.exit(1)}console.log('deployed footer matches this build')"
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          echo "stargowork.com/ → $(curl -s -o /dev/null -w '%{http_code}' -A "$ua" "https://stargowork.com/?deploy=${GITHUB_SHA::7}") (for the record; 403 here is bot protection)"
          echo "Deployed main@${GITHUB_SHA::7} as $id to the stargowork project (https://stargowork.com)" >> "$GITHUB_STEP_SUMMARY"
