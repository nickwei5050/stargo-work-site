name: Deploy to Cloudflare Pages

# Publishes the site to the Cloudflare Pages project `stargowork` (custom domains stargowork.com and
# www.stargowork.com; checked 2026-11-09) whenever main
# changes. Every change reaches main through a pull request that "Site
# verification" has already checked, so this job only packages and uploads.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   an API token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the `stargowork` project
# The old project `stargo` has no custom domain (only stargo.pages.dev, which 301s to stargowork.com), so a deploy
# there changes nothing users see: until 2026-11-09 this job deployed there and stargowork.com stayed stale.
# Until both exist the job says so and stops without failing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the deploy secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; nothing was deployed." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: '22'

      - name: Package the site into dist/
        if: steps.secrets.outputs.ready == 'true'
        run: node tools/make-dist.mjs

      - name: Upload to Cloudflare Pages
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes wrangler@4.20.0 pages deploy dist --project-name stargowork --branch main --commit-hash "$GITHUB_SHA" --commit-message "main@${GITHUB_SHA::7}"

      # Check the real domain, not a pages.dev host: the page must answer 200 and carry this commit's footer line.
      - name: Smoke-check production
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sleep 30
          for path in / /en/ /pricing /contact; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://stargowork.com$path?deploy=${GITHUB_SHA::7}")
            echo "$path → $code"
            [ "$code" = 200 ] || exit 1
          done
          curl -s "https://stargowork.com/?deploy=${GITHUB_SHA::7}" > /tmp/home.html
          # The copyright line of the page just built must be the one served (it carries the Stargo Growth line).
          node -e "const fs=require('fs');const re=/© 2026 STARGO WORK[^]*?<\/p>/;const want=(fs.readFileSync('dist/index.html','utf8').match(re)||[])[0];const got=(fs.readFileSync('/tmp/home.html','utf8').match(re)||[])[0];if(!want||want!==got){console.log('live footer differs from this build:\n want '+want+'\n got  '+got);process.exit(1)}console.log('live footer matches this build')"

          echo "Deployed main@${GITHUB_SHA::7} to the stargowork project (https://stargowork.com)" >> "$GITHUB_STEP_SUMMARY"
