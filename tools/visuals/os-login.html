<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../css/inter.css"><link rel="stylesheet" href="os.css"><script src="lib.js"></script>
<style>
  .card.login{position:absolute;left:50%;top:50%;width:680px;height:530px;transform:translate(-50%,-50%);border-radius:28px;padding:44px 48px;background:rgba(16,11,8,.55);backdrop-filter:blur(30px);border-color:rgba(255,255,255,.12);box-shadow:0 40px 100px rgba(0,0,0,.5)}
  .top{display:flex;justify-content:space-between;align-items:center}
  .wm{font-size:15px;letter-spacing:.3em;font-weight:500}
  .welcome{margin-top:78px;font-size:11px;letter-spacing:.3em;color:var(--muted)}
  .name{font-size:72px;font-weight:300;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
  .field{display:flex;gap:18px;margin-top:40px;align-items:stretch}
  .inp{flex:1;height:72px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);display:flex;align-items:center;padding:0 24px;font-size:20px;color:var(--faint)}
  .go{width:100px;height:72px;border-radius:16px;background:linear-gradient(135deg,#f7b98a,#d98a55);display:flex;align-items:center;justify-content:center;color:#1a0d06;box-shadow:0 10px 30px rgba(232,130,58,.35)}
  .foot{position:absolute;left:48px;right:48px;bottom:44px;display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted);padding-top:34px;border-top:1px solid var(--line)}
  .foot span{display:flex;align-items:center;gap:10px}
  .ringi{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);display:inline-block}
</style></head><body><div class="stage"><span data-tpl="wall" data-args="[true]"></span>
<div class="card login">
  <div class="top"><span class="wm">STARGO OS</span><span style="color:var(--muted)" data-icon="star" data-size="20" data-sw="1.4"></span></div>
  <div class="welcome">WELCOME</div><div class="name">Jason</div>
  <div class="field"><div class="inp">Enter your password</div><div class="go" data-icon="arrow" data-size="28" data-sw="2"></div></div>
  <div class="foot"><span><i class="ringi"></i>Secure login</span><span>Forgot password?</span></div>
</div></div></body></html>
