<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../css/inter.css"><link rel="stylesheet" href="os.css"><script src="lib.js"></script>
<style>
  html,body{background:transparent}
  .stage{width:114px;height:114px;background:transparent}
  .stage.core{width:240px;height:240px}
  .av{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:40px;letter-spacing:.02em;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.35)}
  .av::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),inset 0 -20px 30px rgba(0,0,0,.25)}
  .core .av{background:#0c0906}
</style></head><body><div class="stage" id="st"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const v=new URLSearchParams(location.search).get('v')||'1';
  if(v==='core'){st.className='stage core';st.innerHTML=`<div class="av"><span class="orb" style="width:200px;height:200px"></span></div>`;return;}
  const A=[['MR','#e8823a','#7a2f12'],['II','#f0b35a','#8a4a10'],['DD','#ff6b8a','#7a1f36'],['BC','#8f7cff','#3a2b8a'],['PM','#6aa9ff','#1f3f8a'],['QA','#5fd08b','#1d5a36'],['FU','#f2a35b','#6a3a12'],['MS','#c4622a','#4a1f0c'],['OR','#ff8a3d','#7a2f12'],['CS','#7c5cff','#2b1d6b'],['KB','#4dc3ff','#134a6b'],['EV','#ff4d9d','#6b1440']][+v-1];
  st.innerHTML=`<div class="av" style="background:linear-gradient(145deg,${A[1]},${A[2]})">${A[0]}</div>`;
});
</script></body></html>
