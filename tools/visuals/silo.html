<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../css/inter.css"><script src="lib.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#e9eaee}
  body{font-family:Inter,system-ui,sans-serif;font-size:13px;color:#1f2937;-webkit-font-smoothing:antialiased;filter:saturate(.72) contrast(.96)}
  .stage{position:relative;width:1500px;height:1000px;overflow:hidden;background:#eef0f3}
  svg{display:block}
  /* email */
  .mail{display:grid;grid-template-columns:220px 520px 1fr;height:100%}
  .mail .fold{background:#f5f6f8;border-right:1px solid #d9dce2;padding:18px 12px}
  .mail .fold div{padding:8px 12px;border-radius:6px;color:#4b5563;font-size:13px;display:flex;justify-content:space-between}
  .mail .fold div.on{background:#dfe4ee;color:#111827;font-weight:600}
  .mail .fold b{background:#f59e0b;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px}
  .mail .list{border-right:1px solid #d9dce2;background:#fff}
  .mail .bar{height:52px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 16px;gap:10px;color:#6b7280}
  .mail .it{padding:12px 16px;border-bottom:1px solid #eef0f3;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
  .mail .it.u{background:#fbfcff}.mail .it.u .s,.mail .it.u .t{font-weight:700}
  .mail .it .s{font-size:12.5px}.mail .it .t{font-size:12.5px}.mail .it .p{grid-column:1/3;color:#6b7280;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mail .it .d{color:#9ca3af;font-size:11px}
  .mail .read{padding:28px 32px;background:#fff}
  .mail .read h2{font-size:20px;font-weight:600}
  .mail .read p{margin-top:14px;line-height:1.6;color:#374151;font-size:13.5px}
  .mail .badge{position:absolute;left:250px;top:60px;background:#fde68a;color:#78350f;font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px}
  /* whatsapp */
  .wa{display:grid;grid-template-columns:380px 1fr;height:100%}
  .wa .l{background:#fff;border-right:1px solid #d9dce2}
  .wa .top{height:60px;background:#f0f2f5;display:flex;align-items:center;padding:0 16px;gap:10px;border-bottom:1px solid #d9dce2}
  .wa .c{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #eef0f3;align-items:center}
  .wa .c .av{width:44px;height:44px;border-radius:50%;background:#cfd6df;flex:none}
  .wa .c .n{font-weight:600;font-size:13.5px}.wa .c .m{color:#6b7280;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
  .wa .c .r{margin-left:auto;text-align:right;font-size:11px;color:#9ca3af}.wa .c .r b{display:inline-block;background:#25d366;color:#fff;border-radius:10px;padding:1px 6px;margin-top:4px;font-size:10.5px}
  .wa .chat{background:#e5ddd5;position:relative;display:flex;flex-direction:column}
  .wa .msgs{flex:1;padding:24px 60px;display:flex;flex-direction:column;gap:10px}
  .wa .b{max-width:52%;padding:8px 12px;border-radius:8px;font-size:13.5px;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.08)}
  .wa .b.me{align-self:flex-end;background:#d9fdd3}
  .wa .b small{display:block;text-align:right;color:#9ca3af;font-size:10px;margin-top:3px}
  .wa .day{align-self:center;background:#fff;border-radius:6px;padding:4px 10px;font-size:11px;color:#6b7280}
  .wa .foot{height:60px;background:#f0f2f5;display:flex;align-items:center;padding:0 20px;gap:12px;color:#6b7280}
  .wa .foot div{flex:1;height:40px;border-radius:20px;background:#fff;display:flex;align-items:center;padding:0 16px;color:#9ca3af}
  /* excel */
  .xl{height:100%;display:flex;flex-direction:column;background:#fff}
  .xl .title{height:36px;background:#217346;color:#fff;display:flex;align-items:center;padding:0 14px;font-size:12.5px;gap:14px}
  .xl .ribbon{height:80px;background:#f3f3f3;border-bottom:1px solid #d1d5db;display:flex;align-items:flex-end;padding:0 14px 6px;gap:26px;font-size:12px;color:#444}
  .xl .fx{height:30px;border-bottom:1px solid #d1d5db;display:flex;align-items:center;font-size:12px}
  .xl .fx span{width:80px;border-right:1px solid #d1d5db;height:100%;display:flex;align-items:center;justify-content:center;color:#555}
  .xl .fx i{padding-left:10px;font-style:normal;color:#333}
  .xl table{border-collapse:collapse;font-size:12px;width:100%}
  .xl th,.xl td{border:1px solid #d9d9d9;padding:0 6px;height:22px;white-space:nowrap;overflow:hidden;text-align:left}
  .xl th{background:#f3f3f3;font-weight:400;color:#555;text-align:center}
  .xl td.h{background:#f3f3f3;text-align:center;color:#555;width:36px}
  .xl .y{background:#fff2cc}.xl .r{background:#f8cbad}.xl .g{background:#e2efda}.xl .err{color:#c00;font-weight:700}
  .xl .tabs{margin-top:auto;height:30px;border-top:1px solid #d1d5db;display:flex;align-items:center;font-size:12px;background:#f3f3f3}
  .xl .tabs span{padding:5px 14px;border-right:1px solid #d1d5db}.xl .tabs span.on{background:#fff;color:#217346;font-weight:700;border-bottom:2px solid #217346}
  /* erp */
  .erp{height:100%;background:#d4d0c8;display:flex;flex-direction:column;font-family:Tahoma,Verdana,Inter,sans-serif;font-size:12px}
  .erp .t{height:28px;background:linear-gradient(#0a246a,#a6caf0);color:#fff;display:flex;align-items:center;padding:0 8px;font-weight:700}
  .erp .menu{height:24px;display:flex;align-items:center;gap:16px;padding:0 8px;border-bottom:1px solid #808080}
  .erp .tb{height:30px;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid #808080}
  .erp .tb i{width:22px;height:22px;background:#c0c0c0;border:1px solid #808080;display:block}
  .erp .grid{flex:1;margin:8px;background:#fff;border:2px inset #808080;overflow:hidden;position:relative}
  .erp table{border-collapse:collapse;width:100%;font-size:11.5px}
  .erp th{background:#ece9d8;border:1px solid #aca899;padding:3px 6px;text-align:left;font-weight:700}
  .erp td{border-bottom:1px solid #e0e0e0;border-right:1px solid #eee;padding:3px 6px;white-space:nowrap}
  .erp tr:nth-child(even) td{background:#f4f4f4}
  .erp tr.sel td{background:#0a246a;color:#fff}
  .erp .dlg{position:absolute;left:520px;top:300px;width:440px;background:#ece9d8;border:1px solid #0a246a;box-shadow:4px 4px 0 rgba(0,0,0,.25)}
  .erp .dlg .dt{height:24px;background:linear-gradient(90deg,#0a246a,#a6caf0);color:#fff;display:flex;align-items:center;padding:0 8px;font-weight:700}
  .erp .dlg .bd{padding:14px}
  .erp .dlg .bd div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted #aca899}
  .erp .dlg .btns{display:flex;justify-content:flex-end;gap:8px;padding:0 14px 12px}
  .erp .dlg .btns span{border:1px solid #003c74;background:#f0f0ea;padding:3px 16px;border-radius:3px}
  .erp .sb{height:22px;border-top:1px solid #808080;display:flex;align-items:center;padding:0 8px;gap:20px;color:#333}
